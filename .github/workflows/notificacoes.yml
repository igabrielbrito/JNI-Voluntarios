name: Notificações

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      seco:
        description: "Só mostrar o que seria enviado (não manda nada)"
        type: boolean
        default: false

concurrency:
  group: notificacoes
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY_RUN: ${{ inputs.seco && '1' || '0' }}
          CAL_DIR: cal
      - name: Publicar agendas
        if: ${{ !inputs.seco }}
        run: |
          git add -A cal
          if git diff --cached --quiet; then echo "Agendas sem mudança."; exit 0; fi
          git -c user.name="JNI robô" -c user.email="robo@users.noreply.github.com" commit -q -m "Agendas atualizadas"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          curl -s -o /dev/null -w "Pages: %{http_code}\n" -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds || true
