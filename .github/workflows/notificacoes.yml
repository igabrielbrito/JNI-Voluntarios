name: Notificações

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      seco:
        description: "Só mostrar o que seria enviado (não manda nada)"
        type: boolean
        default: false

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/notify.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY_RUN: ${{ inputs.seco && '1' || '0' }}
